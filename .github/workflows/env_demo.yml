name: Show env variables
on: workflow_dispatch

env:
  NAME: Shashwat
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "My name is ${{env.NAME}}"
      - name: Show secrets
        run: echo "Secret is ${{secrets.SECRET_PASS}}"
      - name: Show variables
        run: echo "My docker hub username is ${{vars.DOCKERHUB_USERNAME}}"
